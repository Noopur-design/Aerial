name: Deploy to GitHub Pages

# Builds the static export and publishes it to the `gh-pages` branch.
# Enable once in the repo: Settings -> Pages -> Source: "Deploy from a branch"
# -> Branch: gh-pages / (root). Site: https://<owner>.github.io/Aerial/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Not `npm ci`: Tailwind v4's native oxide binary has OS-specific
        # optional deps, and a Windows-authored lockfile fails ci on Linux.
        run: npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          PAGES: 'true'

      - name: Publish to gh-pages
        run: |
          cd out
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
